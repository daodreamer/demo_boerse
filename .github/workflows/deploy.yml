name: Build & Deploy

on:
  push:
    branches: [with_docker]

jobs:
  build-php:
    name: Build PHP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push php
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.php
          push: true
          tags: daodreamer/boerse-php:latest

  build-nginx:
    name: Build Nginx image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: daodreamer/boerse-nginx:latest

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-php, build-nginx]
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Deploy sidecar containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: boersedemocontainer
          sitecontainers-config: >-
            [
              {
                "name": "nginx",
                "image": "daodreamer/boerse-nginx:latest",
                "targetPort": 80,
                "isMain": true
              },
              {
                "name": "php",
                "image": "daodreamer/boerse-php:latest",
                "targetPort": 9000,
                "isMain": false
              }
            ]
